services:
  - type: web
    name: practicas-servicios-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USUARIO
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NOMBRE
        sync: false
