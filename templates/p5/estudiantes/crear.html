{% extends "base.html" %}

{% block titulo %}Agregar estudiante{% endblock %}

{% block contenido %}
    <div class="contenedor-ancho">
        <div class="tarjeta">
            <div class="encabezado">Agregar estudiante</div>
            <div class="cuerpo">
                <form method="POST">
                    <div class="campo">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" name="matricula" placeholder="A2025001" required>
                    </div>
                    <div class="fila">
                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>
                        <div class="campo">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="carrera">Carrera</label>
                        <input type="text" id="carrera" name="carrera" required>
                    </div>
                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                    <div class="campo">
                        <label for="promedio">Promedio</label>
                        <input type="number" id="promedio" name="promedio" step="0.01" min="0" max="10" required>
                    </div>
                    <div class="campo">
                        <label for="contrasena">Contraseña de la cuenta</label>
                        <input type="password" id="contrasena" name="contrasena" required>
                        <p class="pequena">Entrará con su matrícula y esta contraseña.</p>
                    </div>
                    <button type="submit" class="boton boton-verde">Guardar</button>
                    <a class="boton boton-gris" href="{{ url_for('practica5.listar_estudiantes') }}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
