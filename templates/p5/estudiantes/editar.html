{% extends "base.html" %}

{% block titulo %}Editar estudiante{% endblock %}

{% block contenido %}
    <div class="contenedor-ancho">
        <div class="tarjeta">
            <div class="encabezado">Editar estudiante</div>
            <div class="cuerpo">
                <form method="POST">
                    <div class="campo">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" name="matricula"
                               value="{{ estudiante['matricula'] }}" required>
                    </div>
                    <div class="fila">
                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre"
                                   value="{{ estudiante['nombre'] }}" required>
                        </div>
                        <div class="campo">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido"
                                   value="{{ estudiante['apellido'] }}" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="carrera">Carrera</label>
                        <input type="text" id="carrera" name="carrera"
                               value="{{ estudiante['carrera'] }}" required>
                    </div>
                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo"
                               value="{{ estudiante['correo'] }}" required>
                    </div>
                    <div class="campo">
                        <label for="promedio">Promedio</label>
                        <input type="number" id="promedio" name="promedio" step="0.01" min="0" max="10"
                               value="{{ estudiante['promedio'] }}" required>
                    </div>
                    <button type="submit" class="boton">Guardar cambios</button>
                    <a class="boton boton-gris" href="{{ url_for('practica5.listar_estudiantes') }}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
