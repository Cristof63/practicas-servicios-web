{% extends "base.html" %}

{% block titulo %}Registrar estudiante{% endblock %}

{% block contenido %}
    <div class="contenedor-ancho">
        <div class="tarjeta">
            <div class="encabezado">Registrar estudiante</div>
            <div class="cuerpo">
                <p class="pequena">
                    Te registrarás con tu <strong>matrícula</strong> como usuario.
                </p>
                <form method="POST">
                    <div class="campo">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" name="matricula" placeholder="A2025001" required>
                    </div>
                    <div class="fila">
                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>
                        <div class="campo">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="carrera">Carrera</label>
                        <input type="text" id="carrera" name="carrera" required>
                    </div>
                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                    <div class="campo">
                        <label for="promedio">Promedio</label>
                        <input type="number" id="promedio" name="promedio" step="0.01" min="0" max="10" required>
                    </div>
                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" required>
                    </div>
                    <div class="campo">
                        <label for="repetir_contrasena">Repetir contraseña</label>
                        <input type="password" id="repetir_contrasena"
                               name="repetir_contrasena" required>
                        <p class="pequena">Debe tener al menos 8 caracteres y
                            ser igual a la de arriba.</p>
                    </div>
                    <button type="submit" class="boton">Crear cuenta</button>
                    <a class="boton boton-gris" href="{{ url_for('practica5.login') }}">Ya tengo cuenta</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
